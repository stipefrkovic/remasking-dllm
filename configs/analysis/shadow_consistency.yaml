dataset_name: 'openai_humaneval'
model_path: 'GSAI-ML/LLaDA-8B-Instruct'
data_root: ""

dataset_config:
  data_loader: 'huggingface'
  loader_fn: null
  load_dataset_args: { path: "openai_humaneval" }
  split: "test"
  doc_to_text_fn: "humaneval_doc_to_text"
  extract_answer_fn: "humaneval_extract_answer"
  is_correct_fn: null
  eval_mode: "save_only"
  prompt_suffix: ""
  output_formatter: 'humaneval'

generation_args: { gen_length: 256, block_length: 32, temperature: 0.0 }
method: 'wino'
method_args:
  wino:
    threshold: 0.6
    threshold_back: 0
    disable_max_accept: true
    use_shadow: True
    debug_prob: True

config_name: 'analysis_shadow_consistency'
